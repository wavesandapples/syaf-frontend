<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Syaf's Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="form-container">
    <h2>Sign Up</h2>
    <form action="http://localhost/mywebsite/signup.php" method="POST">
      <table>
        <tr><td>First Name:</td><td><input type="text" id="fname" required></td></tr>
        <tr><td>Last Name:</td><td><input type="text" id="lname" required></td></tr>
        <tr><td>Email:</td><td><input type="email" id="email" required></td></tr>
        <tr><td>Password:</td><td><input type="password" id="pass" required></td></tr>
        <tr><td>Re-enter Password:</td><td><input type="password" id="repass" required></td></tr>
        <tr>
          <td colspan="2">
            <button type="submit">Submit</button>
            <button type="reset">Clear</button>
            <button type="button" onclick="window.location='home.html'">Cancel</button>
          </td>
        </tr>
      </table>
    </form>
    <p id="signupError" class="error"></p>
  </section>
  <script src="script.js"></script>
</body>
</html>
