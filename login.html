<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Syaf's Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="form-container">
    <h2>Login</h2>
    <form action="http://localhost/mywebsite/login.php" method="POST">

      <table>
        <tr><td>ID:</td><td><input type="text" id="userid" required></td></tr>
        <tr><td>Password:</td><td><input type="password" id="password" required></td></tr>
        <tr>
          <td colspan="2">
            <button type="submit">Submit</button>
            <button type="reset">Clear</button>
            <button type="button" onclick="window.location='home.html'">Cancel</button>
          </td>
        </tr>
      </table>
      <p><a href="#">Forgot Password?</a></p>
    </form>
    <p id="loginError" class="error"></p>
  </section>
  <script src="script.js"></script>
</body>
</html>
